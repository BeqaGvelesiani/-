<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Smart Clock Kiosk Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        width: 800px;
        height: 480px;
        overflow: hidden;
        background-color: #0b0f19;
        color: #f8fafc;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 10px 16px;
      }

      /* ზედა პანელი */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .date-geo {
        font-size: 50px;
        font-weight: 600;
        color: #0a65d6;
      }

      .clock-top-right {
        font-size: 3.5rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 1px;
        line-height: 1;
      }

      /* ცენტრალური სექცია - მაქსიმალური ფონტებით */
      .center-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        gap: 4px;
        width: 100%;
      }

      .countdown-main {
        font-size: 3.5rem;
        font-weight: 800;
        color: #38bdf8;
        letter-spacing: -1px;
        line-height: 1.1;
      }

      .countdown-sub {
        font-size: 5rem;
        font-weight: 700;
        color: #e5e5e0;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }

      .info-row {
        display: flex;
        gap: 20px;
        font-size: 1.3rem;
        font-weight: 600;
        color: #f8fafc;
        margin-top: 4px;
      }

      .info-row span {
        background: rgba(30, 41, 59, 0.85);
        padding: 4px 14px;
        border-radius: 10px;
        border: 1px solid #475569;
      }

      /* პროგრეს ბარი */
      .progress-container {
        width: 95%;
        background-color: #1e293b;
        border-radius: 40px;
        height: 40px;
        overflow: hidden;
        border: 2px solid #efeeed;
        margin-top: 6px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        transition:
          width 0.5s ease,
          background-color 0.5s ease;
      }

      /* ქვედა პანელი */
      .bottom-bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        width: 100%;
      }

      .widget-box {
        background: rgba(30, 41, 59, 0.75);
        border: 1px solid #475569;
        border-radius: 10px;
        padding: 6px 14px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .widget-title {
        font-size: 0.95rem;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
      }

      .widget-value {
        font-size: 2rem;
        font-weight: 700;
        color: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- ზედა პანელი -->
    <div class="top-bar">
      <div class="date-js" id="dateGeo">იტვირთება...</div>
      <div class="clock-top-right" id="clockTopRight">00:00:00</div>
    </div>

    <!-- ცენტრი: უკუთვლა და სტატისტიკა -->
    <div class="center-content">
      <div class="countdown-main" id="countdownMain">
        0 თვე : 0 კვირა : 0 დღე
      </div>
      <div class="countdown-sub" id="countdownSub">00:00:00:00</div>

      <div class="info-row">
        <span id="workDays">სამუშაო დღეები: --</span>
        <span id="yearPercent">პროცენტი: --%</span>
      </div>

      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- ქვედა პანელი -->
    <div class="bottom-bar">
      <div class="widget-box">
        <span class="widget-title">ამინდი (თბილისი)</span>
        <span class="widget-value" id="weatherWidget">იტვირთება...</span>
      </div>

      <div class="widget-box" style="text-align: right">
        <span class="widget-title">ეროვნული ბანკი</span>
        <span class="widget-value" id="nbgWidget">USD: იტვირთება...</span>
      </div>
    </div>

    <script>
      // სამიზნე თარიღი: 2027 წლის 14 იანვარი, 00:00:00
      const targetDate = new Date("2027-01-14T00:00:00");
      // პერიოდის დასაწყისი წლის პროცენტისთვის (14 იანვარი 2026)
      const startDate = new Date("2026-01-14T00:00:00");

      function updateDashboard() {
        const now = new Date();

        // 1. ზედა მარცხენა თარიღი ქართულად
        const options = { weekday: "long", month: "long", day: "numeric" };
        document.getElementById("dateGeo").textContent = now.toLocaleDateString(
          "ka-GE",
          options,
        );

        // 2. ზედა მარჯვენა საათი (მსხვილი თეთრი)
        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");
        const seconds = String(now.getSeconds()).padStart(2, "0");
        document.getElementById("clockTopRight").textContent =
          `${hours}:${minutes}:${seconds}`;

        // 3. უკუთვლა და დროის გამოთვლა
        const diff = targetDate - now;

        if (diff > 0) {
          const totalSecs = Math.floor(diff / 1000);
          const days = Math.floor(totalSecs / (3600 * 24));
          const months = Math.floor(days / 30.4375);
          const remDaysAfterMonths = Math.floor(days % 30.4375);
          const weeks = Math.floor(remDaysAfterMonths / 7);
          const finalDays = Math.floor(remDaysAfterMonths % 7);

          const h = String(
            Math.floor((totalSecs % (3600 * 24)) / 3600),
          ).padStart(2, "0");
          const m = String(Math.floor((totalSecs % 3600) / 60)).padStart(
            2,
            "0",
          );
          const s = String(totalSecs % 60).padStart(2, "0");
          const ms10 = String(Math.floor((diff % 1000) / 10)).padStart(2, "0");

          document.getElementById("countdownMain").textContent =
            `${months} თვე : ${weeks} კვირა : ${finalDays} დღე`;
          document.getElementById("countdownSub").textContent =
            `${h}:${m}:${s}:${ms10}`;
        } else {
          document.getElementById("countdownMain").textContent =
            "ვადა ამოიწურა";
          document.getElementById("countdownSub").textContent = "00:00:00:00";
        }

        // 4. წლის გასული/დარჩენილი პროცენტი და პროგრეს ბარი
        const totalPeriod = targetDate - startDate;
        const elapsedPeriod = now - startDate;
        let percent = (elapsedPeriod / totalPeriod) * 100;
        if (percent < 0) percent = 0;
        if (percent > 100) percent = 100;

        const remainingPercent = (100 - percent).toFixed(1);
        document.getElementById("yearPercent").textContent =
          `${remainingPercent}%`;

        const progressBar = document.getElementById("progressBar");
        progressBar.style.width = `${percent}%`;

        // ფერის შეცვლა წითლიდან მწვანემდე (0% წითელი -> 100% მწვანე)
        const hue = percent * 1.2;
        progressBar.style.backgroundColor = `hsl(${hue}, 90%, 45%)`;

        // 5. სამუშაო დღეების გამოთვლა
        let workDaysCount = 0;
        let curr = new Date(now.getTime());
        while (curr < targetDate) {
          const dayOfWeek = curr.getDay();
          if (dayOfWeek !== 0 && dayOfWeek !== 6) {
            workDaysCount++;
          }
          curr.setDate(curr.getDate() + 1);
        }
        document.getElementById("workDays").textContent =
          `${workDaysCount} სამუშაო დღე`;
      }

      // 6. ამინდის წამოღება (Open-Meteo API თბილისისთვის)
      async function fetchWeather() {
        try {
          const res = await fetch(
            "https://api.open-meteo.com/v1/forecast?latitude=41.7151&longitude=44.8271&current_weather=true",
          );
          const data = await res.json();
          const temp = Math.round(data.current_weather.temperature);
          document.getElementById("weatherWidget").textContent =
            `${temp > 0 ? "+" : ""}${temp}°C`;
        } catch (e) {
          document.getElementById("weatherWidget").textContent = "მიუწვდომელია";
        }
      }

      // 7. ლარის და დოლარის კურსი საქართველოს ეროვნული ბანკიდან
      async function fetchNBG() {
        try {
          const res = await fetch(
            "https://nbg.gov.ge/gw/api/ct/monetarypolicy/currencies/ka/json",
          );
          const data = await res.json();
          const currencies = data[0].currencies;
          const usd = currencies.find((c) => c.code === "USD");
          if (usd) {
            document.getElementById("nbgWidget").textContent =
              `USD: ${usd.rate.toFixed(4)} GEL`;
          }
        } catch (e) {
          document.getElementById("nbgWidget").textContent =
            "USD: ვერ მოიძებნა";
        }
      }

      // გაშვება
      setInterval(updateDashboard, 50);
      updateDashboard();

      fetchWeather();
      fetchNBG();
      setInterval(fetchWeather, 30 * 60 * 1000);
      setInterval(fetchNBG, 30 * 60 * 1000);
    </script>
  </body>
</html>
